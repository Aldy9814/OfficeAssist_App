<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Audit Log</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
</head>
<body>
    <div id="root"></div>

    <script id="server-data" type="application/json">
    {
        "auditLogs": {{ audit_list_json | safe }}
    }
    </script>
    <script>
        window.SERVER_DATA = JSON.parse(document.getElementById('server-data').textContent);
    </script>

    {% raw %}
    <script type="text/babel">
        const { useState } = React;

        function Sidebar({ activePage }) {
            // Penambahan fungsi handleLogout
            const handleLogout = async () => {
                try {
                    const response = await fetch('/api/logout', { method: 'POST' });
                    if (response.ok) {
                        window.location.href = '/login';
                    }
                } catch (error) {
                    alert("Terjadi kesalahan saat logout.");
                }
            };

            return (
                <div style={styles.sidebar}>
                    <div>
                        <h4 style={styles.sidebarHeader}><i className="bi bi-robot me-2"></i>OfficeAssist</h4>
                        <nav className="mb-auto">
                            <a href="/" style={{...styles.sidebarLink, ...(activePage === 'dashboard' ? styles.sidebarLinkActive : {})}}><i className="bi bi-speedometer2 me-2"></i>Dashboard</a>
                            <a href="/karyawan" style={{...styles.sidebarLink, ...(activePage === 'karyawan' ? styles.sidebarLinkActive : {})}}><i className="bi bi-people me-2"></i>Karyawan</a>
                            <a href="/inventaris" style={{...styles.sidebarLink, ...(activePage === 'inventaris' ? styles.sidebarLinkActive : {})}}><i className="bi bi-box-seam me-2"></i>Inventaris</a>
                            <a href="/audit-log" style={{...styles.sidebarLink, ...(activePage === 'audit-log' ? styles.sidebarLinkActive : {})}}><i className="bi bi-journal-text me-2"></i>Audit Log</a>
                            <a href="/broadcast" style={{...styles.sidebarLink, ...(activePage === 'broadcast' ? styles.sidebarLinkActive : {})}}><i className="bi bi-broadcast me-2"></i>Broadcast</a>
                            <a href="/test-broadcast" style={{...styles.sidebarLink, ...(activePage === 'test-broadcast' ? styles.sidebarLinkActive : {})}}><i className="bi bi-shield-check me-2 text-warning"></i>Test Simulator</a>
                        </nav>
                    </div>
                    
                    <div className="mt-auto pt-3 border-top border-secondary">
                        <div className="d-flex align-items-center mb-3 text-white overflow-hidden">
                            <div className="bg-light text-primary rounded-circle d-flex justify-content-center align-items-center me-3 flex-shrink-0" style={{width: '40px', height: '40px', fontSize: '1.2rem'}}>
                                <i className="bi bi-person-fill"></i>
                            </div>
                            <div className="text-truncate">
                                <h6 className="m-0 fw-bold text-truncate">Administrator</h6>
                                <small className="text-white-50 text-truncate d-block">Super Admin</small>
                            </div>
                        </div>
                        <button onClick={handleLogout} className="btn btn-outline-danger w-100 btn-sm fw-bold text-white border-white">
                            <i className="bi bi-box-arrow-left me-2"></i>Logout
                        </button>
                    </div>
                </div>
            );
        }

        function AuditLogApp() {
            const [data] = useState(window.SERVER_DATA);

            return (
                <div style={styles.bodyBackground}>
                    <div className="d-flex w-100">
                        <div className="flex-shrink-0">
                            <Sidebar activePage="audit-log" />
                        </div>
                        
                        <div className="flex-grow-1 p-4" style={{ minWidth: 0 }}>
                            <div className="d-flex justify-content-between align-items-center mb-4">
                                <div>
                                    <h2 className="fw-bold m-0">Log WhatsApp</h2>
                                    <p className="text-muted m-0">Employee chat history</p>
                                </div>
                            </div>
                            
                            <div className="card shadow-sm border-0">
                                <div className="card-body p-0">
                                    <div className="table-responsive">
                                        <table className="table table-hover table-striped mb-0 text-nowrap">
                                            <thead>
                                                <tr style={styles.tableHeader}>
                                                    <th>Waktu</th>
                                                    <th>Nomor WA</th>
                                                    <th>Pesan Masuk</th>
                                                    <th>Intent AI</th>
                                                    <th>Status Response</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                {data.auditLogs.length > 0 ? (
                                                    data.auditLogs.map((log, idx) => (
                                                        <tr key={idx}>
                                                            <td className="text-muted"><i className="bi bi-clock me-1"></i>{log.timestamp}</td>
                                                            <td className="fw-bold">{log.whatsapp_number}</td>
                                                            <td><div style={{maxWidth: '300px', overflow: 'hidden', textOverflow: 'ellipsis'}}>{log.incoming_message}</div></td>
                                                            <td><span className="badge bg-primary">{log.detected_intent}</span></td>
                                                            <td>
                                                                {log.response_status === 'sukses' ? <span className="text-success fw-bold"><i className="bi bi-check-circle me-1"></i>Sukses</span> : 
                                                                 <span className="text-danger fw-bold"><i className="bi bi-x-circle me-1"></i>Gagal</span>}
                                                            </td>
                                                        </tr>
                                                    ))
                                                ) : (
                                                    <tr><td colSpan="5" className="text-center py-5 text-muted">Belum ada data audit log.</td></tr>
                                                )}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        const styles = {
            bodyBackground: { backgroundColor: '#f4f6f9', minHeight: '100vh' },
            sidebar: { 
                width: '260px',             
                height: '100vh',            
                position: 'sticky',         
                top: 0,                     
                backgroundColor: '#203764', 
                color: '#ffffff', 
                padding: '20px', 
                display: 'flex', 
                flexDirection: 'column',
                zIndex: 1000                
            },
            sidebarHeader: { textAlign: 'center', marginBottom: '1.5rem', borderBottom: '1px solid rgba(255, 255, 255, 0.2)', paddingBottom: '1rem' },
            sidebarLink: { color: '#cfd8dc', textDecoration: 'none', padding: '12px 15px', display: 'block', borderRadius: '5px', marginBottom: '5px', transition: 'all 0.3s' },
            sidebarLinkActive: { backgroundColor: '#162646', color: '#ffffff', fontWeight: 'bold' },
            // Menambahkan kembali tableHeader yang sempat terhapus
            tableHeader: { backgroundColor: '#203764', color: '#ffffff', userSelect: 'none' }
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<AuditLogApp />);
    </script>
    {% endraw %}
</body>
</html>
