<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OfficeAssist - Chat Demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
</head>
<body>
    <div id="root"></div>

    {% raw %}
    <script type="text/babel">
        const {useState, useEffect, useRef} = React;

        const UNREGISTERED = '6280000000000';
        const SUGGESTIONS = [
            'status kendaraan',
            'laporan kendaraan minggu lalu',
            'siapa yang pakai mobil hari ini',
            'laporan kendaraan bulan ini',
            'rekap mobil bulan lalu',
            'halo'
        ];

        const handleLogout = async () => {
            if (window.confirm("apakah anda yakin ingin keluar?")) {
                try {
                    const response = await fetch('/api/logout', { method: 'POST' });
                    if (response.ok) { window.location.href = '/login';}
                } catch (error) {
                    alert("Terjadi kesalahan saat logout.");
                }
            }
        };

        function Sidebar({activePage}) {
            return (
                <div style={styles.sidebar}>
                    <div>
                        <h4 style={styles.sidebarHeader}><i className="bi bi-robot me-2"></i></h4>
                        <nav className="mb-auto">
                            <a href="/" style={{...styles.sidebarLink, ...(activePage === 'dashboard' ? styles.sidebarLinkActive : {})}}><i className="bi bi-speedometer2 me-2"></i>Dashboard</a>
                            <a href="/karyawan" style={{...styles.sidebarLink, ...(activePage === 'karyawan' ? styles.sidebarLinkActive : {})}}><i className="bi bi-people me-2"></i>Karyawan</a>
                            <a href="/audit-log" style={{...styles.sidebarLink, ...(activePage === 'audit-log' ? styles.sidebarLinkActive : {})}}><i className="bi bi-journal-text me-2"></i>Audit Log</a>
                            <a href="/broadcast" style={{...styles.sidebarLink, ...(activePage === 'broadcast' ? styles.sidebarLinkActive : {})}}><i className="bi bi-broadcast me-2"></i>Broadcast</a>
                            <a href="/chat" style={{...styles.sidebarLink, ...(activePage === 'chat' ? styles.sidebarLinkActive : {})}}><i className="bi bi-chat-dots me-2"></i>Chat Demo</a>
                        </nav>    
                    </div>
                    <div className="mt-auto pt-3 border-top border-secondary">
                        <div className="d-flex align-items-center mb-3 text-white overflow-hiddent">
                            <div className="bg-light text-primary rounded-circle d-flex justify-content-center me-3 flex-shrink-0" style={{width: '40px', height: '40px', fontSize: '1.2rem'}}>

                                <i className="bi bi-person-fill"></i>
                            </div>
                            <div className="text-truncate">
                                <h6 className="m-0 fw-bold text-truncate">Administrator</h6>
                                <small className="text-white-50 text-truncate d-block">Super Admin</small>
                            </div>
                        </div>
                        <button onClick={handleLogout} className="btn btn-outline-danger w-100 btn-sm fw-bold text-white border-white">
                            <i className="bi bi-box-arrow-left me-2"></i>Logout    
                        </button>
                    </div>
                </div>
            )
        }

        function Bubble({m, showDebug}) {
            const isUser = m.role === 'user';
            const bubbleStyle = isUser ? styles.userBubble : (m.error ? styles.errorBubble : styles.botBubble);
            return (
                <div style={{display: 'flex', justifyContent: isUser ? 'flex-end': 'flex-start', marginBottom: '10px'}}>
                    <div style={bubbleStyle}>
                        {m.kind === 'file' ? (
                            <a href={m.url} download className="d-flex align-items-center text-decoration-none" style={{ color: 'inherit'}}>
                                <i className="bi bi-file-earmark-excel fs-2 me-2 text-success"></i>
                                <div>
                                    <div className="fw-bold">{m.filename}</div>
                                    <small className="text-muted">{m.caption || 'Klik untuk mengunduh'}</small>
                                </div>
                            </a>
                        ) : (
                            <div style={{ whiteSpace: 'pre-wrap', wordBreak: 'break-word'}}>{m.text}</div>
                        )}
                        <div style={styles.time}>{m.time}</div>
                        {showDebug && m.meta ? (
                            <div style={styles.debug}>
                                <div><b>Intent:</b> {m.meta.intent || '-'} &nbsp;|&nbsp; <b>Status:</b> {m.meta.status || '-'} &nbsp;|&nbsp; {m.meta.duration_ms} ms</div>
                                <div><b>Parameter:</b> {m.meta.parsed ? JSON.stringify(m.meta.parsed) : '-'}</div>
                                {m.meta.timings ? (
                                    <div><b>Waktu:</b> pengurai intent {m.meta.timings.intent_ms === undefined ? '-' : m.meta.timings.intent_ms} ms | query dan lainnya {m.meta.timings.rest_ms} ms | total {m.meta.timings.total_ms} ms</div>
                                ) : null}
                            </div>
                        ) : null}
                    </div>
                </div>
            );
        }
        
        function ChatApp() {
            const nowLabel = () => new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit'});
            const idRef = useRef(1);
            const endRef = useRef(null);
            const greeting = {
                id: 0,
                role: 'bot',
                kind: 'text',
                time: nowLabel(),
                text: 'Halo! Saya OfficeAssist.\nPilih karyawan di kanan atas, lalu tanyakan laporan atau status kendaraan. Klik salah satu contoh dibawah untuk mencoba'

            };
            
            const [messages, setMessages] = useState([greeting]);
            const [input, setInput] = useState('');
            const [senders, setSenders] = useState([]);
            const [sender, setSender] = useState('');
            const [loading, setLoading] = useState(false);
            const [showDebug, setShowDebug] = useState(true);
            const [botEnabled, setBotEnabled] = useState(true);

            const addMsg = (m) => {
                const withMeta = Object.assign({ id: idRef.current++, time: nowLabel() }, m);
                setMessages(prev => prev.concat([withMeta]));
            };

            const refreshBot = async () => {
                try {
                    const res = await fetch('/api/bot/status');
                    if (res.ok) { 
                        const d = await res.json(); 
                        setBotEnabled(d.enabled !== false)
                    }
                } catch (e) {}
            };

            useEffect(() => {
                refreshBot();
                fetch('/api/chat/senders').then(r => r.json()).then(d => {
                    setSenders(d.senders || []);
                    if (d.senders && d.senders.length > 0) { setSender(d.senders[0].whatsapp_number); }
                }).catch(() => addMsg({ role: 'bot', kind: 'text', error: true, text: 'Gagal memuat daftar karyawan.'}));
            }, []);

            useEffect(() => {
                if (endRef.current) { endRef.current.scrollIntoView({ behavior: 'smooth' });}
            }, [messages, loading]);

            const send = async (override) => {
                const text = (override != undefined ? override : input).trim();
                if (!text || loading) return;
                if (!sender) {
                    addMsg({ role: 'bot', kind: 'text', error: true, text: 'Pilih karyawan di "Chat sebagai" dulu. Daftar karyawan belum termuat; cek Console atau terminal.'});
                    return;
                }
                setInput('');
                addMsg({role: 'user', kind: 'text', text: text});
                setLoading(true);
                try {
                    const res = await fetch('/api/chat/send', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ sender: sender, text: text})
                    });
                    if (res.status === 401) { window.location.href = '/login'; return; }
                    const data = await res.json();
                    if (!res.ok) {throw new Error(data.detail || 'Permintaan gagal'); }
                    
                    const replies = data.replies || [];
                    if (replies.length === 0){
                        setLoading(false);
                    } else {
                    replies.forEach((r,i) => {
                        setTimeout(() => {
                            const isLast = i === replies.length - 1;
                            addMsg(Object.assign({ role: 'bot', kind: r.type }, r, isLast ? { meta: data.meta}: {}));
                            if (isLast){
                                setLoading(false);
                            }
                        }, i * 450);
                    });
                    }
                } catch (e) {
                    addMsg({ role: 'bot', kind: 'text', error: true, text: 'Terjadi kesalahan: ' + e.message });
                    setLoading(false);
                }
            };

            const clearChat = () => {setMessages([greeting]); };

            return (
                <div style={styles.bodyBackground}>
                    <div className="d-flex w-100">
                        <div className="flex-shrink-0"><Sidebar activePage="chat" /></div>
                        <div className="flex-grow-1 p-4" style={{ minWidth: 0 }}>
                            <div className="d-flex flex-wrap justify-content-between align-items-center mb-3 gap-2">
                                <div>
                                    <h2 className="fw-bold m-0">Chat Demo</h2>
                                    <p className="text-muted m-0">Mencoba OfficeAssist tanapa Whatsapp. alur dan hasilnya sama, dan tercatat di Audit log</p>
                                </div>
                                <div className="d-flex align-items-center gap-3 flex-wrap">
                                    <span className={"badge fs-6 " + (botEnabled ? "bg-success" : "bg-secondary")}>
                                        <i className={"bi me-1 " + (botEnabled ? "bi-toggle-on" : "bi-toggle-off")}></i>{botEnabled ? "Bot Aktif" : "Bot Nonaktif"}    
                                    </span>
                                    <div className="d-flex align-items-center">
                                        <label className="me-2 small fw-bold text-nowrap">Chat sebagai</label>
                                        <select className="form-select form-select-sm" style={{ minWidth: '260px'}} value={sender} onChange={(e) => setSender(e.target.value)}>
                                            <option value="">-- pilih karyawan --</option>
                                            {senders.map(s => (
                                                <option key={s.employee_id} value={s.whatsapp_number}>{s.full_name} ({s.division}) - {s.whatsapp_number}</option>
                                            ))}
                                            <option value={UNREGISTERED}>Nomor tidak terdaftar (uji penolakan)</option>
                                        </select>
                                    </div>
                                    <div className="form-check form-switch m-0">
                                        <input className="form-check-input" type="checkbox" id="dbg" checked={showDebug} onChange={(e) => setShowDebug(e.target.checked)}/>
                                        <label className="form-check-label small" htmlFor="dbg">Tampilkan detail AI</label>
                                    </div>
                                    <button className="btn btn-outline-secondary btn-sm" onClick={clearChat}><i className="bi bi-trash me-1"></i>Bersihkan</button>
                                </div>
                            </div>
                            
                            <div className="card shadow-sm border-0">
                                <div style={styles.chatWindow}>
                                    {messages.map(m => <Bubble key={m.id} m={m} showDebug={showDebug}/>)}
                                    {loading ? (
                                        <div style={{ display: 'flex', justifyContent: 'flex-start', marginBottom: '10px'}}>
                                            <div style={styles.botBubble}>
                                                <span className="spinner-grow spinner-grow-sm me-2" role="status"></span>
                                                <span className="text-muted">OfficeAssist sedang memproses...</span>
                                            </div>    
                                        </div>
                                    ) : null}
                                    <div ref={endRef}></div>
                                </div>
                                <div className="card-footer bg-white">
                                    <div className="d-flex flex-wrap gap-2 mb-2">
                                        {SUGGESTIONS.map(s => (
                                            <button key={s} className="btn btn-outline-primary btn-sm rounded-pill" disabled={loading} onClick={() => send(s)}>{s}</button>
                                        ))}
                                    </div>
                                    <div className="d-flex align-items-center gap-2">
                                        <input type="text" className="form-control flex-grow-1" placeholder="Ketik pesan, misal laporan kendaraan  minggu ini" value={input}
                                            maxLength={500} disabled={loading}S
                                            onChange={(e) => setInput(e.target.value)}
                                            onKeyDown={(e) => {if (e.key === 'Enter') {send(); } }}/>
                                        <button className="btn btn-primary flex-shrink-0" onClick={() => send()} disabled={loading || !input.trim()}>
                                            <i className="bi bi-send me-1"></i>   
                                        </button>   
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            )
        }


        const styles ={
            bodyBackground: { backgroundColor: '#f4f6f9', minHeight: '100vh' },
            sidebar: {
                width: '260px', height: '100vh', position: 'sticky', top: 0, backgroundColor: '#203764',
                color: '#ffffff', padding: '20px', display: 'flex', flexDirection: 'column', zIndex: 1000
            },
            sidebarHeader: { textAlign: 'center', marginBottom: '1.5rem', borderBottom: '1px solid rgba(255, 255, 255, 0.2)', paddingBottom: '1rem' },
            sidebarLink: { color: '#cfd8dc', textDecoration: 'none', padding: '12px 15px', display: 'block', borderRadius: '5px', marginBottom: '5px', transition: 'all 0.3s' },
            sidebarLinkActive: { backgroundColor: '#162646', color: '#ffffff', fontWeight: 'bold' },
            chatWindow: { height: 'calc(100vh - 330px)', minHeight: '320px', overflowY: 'auto', padding: '20px', backgroundColor: '#eef1f6' },
            userBubble: { maxWidth: '70%', backgroundColor: '#203764', color: '#ffffff', padding: '10px 14px', borderRadius: '14px 14px 2px 14px' },
            botBubble: { maxWidth: '70%', backgroundColor: '#ffffff', color: '#212529', padding: '10px 14px', borderRadius: '14px 14px 14px 2px', boxShadow: '0 1px 2px rgba(0,0,0,0.1)' },
            errorBubble: { maxWidth: '70%', backgroundColor: '#fdecea', color: '#842029', padding: '10px 14px', borderRadius: '14px 14px 14px 2px' },
            time: { fontSize: '0.7rem', opacity: 0.6, textAlign: 'right', marginTop: '4px' },
            debug: { fontSize: '0.72rem', color: '#6c757d', borderTop: '1px dashed #ced4da', marginTop: '6px', paddingTop: '6px', wordBreak: 'break-word' }
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ChatApp />);
    </script>
    {% endraw %}

</body>
</html>
